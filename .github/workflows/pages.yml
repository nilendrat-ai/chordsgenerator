name: Test, build and publish the web page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Prepare site
        run: |
          mkdir -p site
          cp dist/chord-sheet.html site/index.html
          cp dist/chord-sheet.html dist/yt-chord-sheet.esm.js dist/yt-chord-sheet.min.js dist/robots.txt dist/sitemap.xml site/
          if [ -f dist/og.png ]; then cp dist/og.png site/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: chord-sheet-dist
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
