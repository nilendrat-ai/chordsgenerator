<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chordsheet preview image</title>
<!-- The link preview picture (1200 x 630). The build screenshots this page into og.png. -->
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#eef0f2;font-family:'Archivo','Arial Black','Helvetica Neue',Arial,sans-serif;color:#111;display:grid;grid-template-columns:560px 1fr;gap:48px;align-items:center;padding:64px 72px}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:34px;letter-spacing:-.01em}
.brand svg{width:56px;height:56px}
h1{font-weight:800;font-size:68px;line-height:1.02;letter-spacing:-.03em;margin:36px 0 22px}
p{font:500 26px/1.35 'Helvetica Neue',Arial,sans-serif;color:#4c4e54;margin:0}
.card{background:#fff;border-radius:24px;padding:22px;display:grid;gap:12px;box-shadow:0 20px 50px rgb(0 0 0/.08)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.c{height:104px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:40px;letter-spacing:-.01em}
.on{outline:4px solid #111;outline-offset:3px}
</style>
</head>
<body>
<div>
  <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#ff4a1c"/><path d="M12 22V9l10-2v13" stroke="#fff" stroke-width="2.5" fill="none"/><circle cx="10" cy="22" r="3" fill="#fff"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg>Chordsheet</div>
  <h1>Turn any song into a chord chart</h1>
  <p>YouTube, MP3 or MP4. Free, in your browser.</p>
</div>
<div class="card">
  <div class="row">
    <div class="c" style="background:#cdeefd">G</div>
    <div class="c" style="background:#f8ecd2">D</div>
    <div class="c on" style="background:#3f9a4c;color:#fff">Em</div>
    <div class="c" style="background:#ffdcd8">C</div>
  </div>
  <div class="row">
    <div class="c" style="background:#cdeefd">G</div>
    <div class="c" style="background:#f8ecd2">D</div>
    <div class="c" style="background:#ffdcd8">C</div>
    <div class="c" style="background:#ffdcd8">C</div>
  </div>
  <div class="row">
    <div class="c" style="background:#d6ecd8">Em</div>
    <div class="c" style="background:#ffdcd8">C</div>
    <div class="c" style="background:#cdeefd">G</div>
    <div class="c" style="background:#f8ecd2">D</div>
  </div>
</div>
</body>
</html>
